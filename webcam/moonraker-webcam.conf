# Add to ~/printer_data/config/moonraker.conf on the printer's Pi.

[webcam chamber]
location: printer
service: mjpegstreamer-adaptive      # the browser pulls snapshots, so a slow tab never backs up the Pi
enabled: True
target_fps: 15
target_fps_idle: 5
stream_url: /webcam/?action=stream
snapshot_url: /webcam/?action=snapshot
flip_horizontal: False
flip_vertical: False
rotation: 0
aspect_ratio: 16:9

# Only if crowsnest is not already in the update manager:
[update_manager crowsnest]
type: git_repo
path: ~/crowsnest
origin: https://github.com/mainsail-crew/crowsnest.git
managed_services: crowsnest
install_script: tools/pkglist.sh
