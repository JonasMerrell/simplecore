#### crowsnest.conf for the simplecore chamber camera (Logitech C270, USB UVC)
#### Goes in ~/printer_data/config/crowsnest.conf on the printer's Pi 3B.
#### Light on the Pi: the camera makes the JPEGs itself and ustreamer only passes them on.

[crowsnest]
log_level: quiet
rollover_on_start: true         # crowsnest v5: start each run with a fresh log (~/printer_data/logs/crowsnest.log)
no_proxy: false

[cam chamber]
mode: ustreamer                 # MJPEG pass-through, the lowest CPU load on a Pi 3B
port: 8080
# Jonas's camera (from ls /dev/v4l/by-id/, the ...-video-index0 entry)
device: /dev/v4l/by-id/usb-046d_C270_HD_WEBCAM_973053A0-video-index0
resolution: 1280x720            # the C270's native size; it sends MJPEG itself at this size
max_fps: 15
