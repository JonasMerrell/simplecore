#### crowsnest.conf for the simplecore chamber camera (3DO Enclosure Camera V2.5, USB UVC)
#### Goes in ~/printer_data/config/crowsnest.conf on the printer's Pi 3B.
#### Light on the Pi: the camera makes the JPEGs itself and ustreamer only passes them on.

[crowsnest]
log_path: ~/printer_data/logs/crowsnest.log
log_level: quiet
delete_log: true
no_proxy: false

[cam chamber]
mode: ustreamer                 # MJPEG pass-through, the lowest CPU load on a Pi 3B
enable_rtsp: false
port: 8080
# Replace with the real path from: ls /dev/v4l/by-id/   (use the ...-video-index0 entry)
device: /dev/v4l/by-id/usb-3DO_3DO_USB_CAMERA-video-index0
resolution: 1280x720            # the sensor does 4K, but 720p keeps USB and Wi-Fi/Ethernet traffic small
max_fps: 15
#custom_flags:
#v4l2ctl: focus_absolute=0
